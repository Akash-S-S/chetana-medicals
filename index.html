<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chethana Medicals</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            .btn-group {
                flex-direction: column;
            }
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            flex: 1;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0d62c0;
        }
        #clearBtn {
            background-color: #f44336;
        }
        #clearBtn:hover {
            background-color: #d32f2f;
        }
        .result {
            margin-top: 30px;
            padding: 15px;
            background-color: #e8f0fe;
            border-radius: 4px;
            font-size: 18px;
            text-align: center;
        }
        .result.hidden {
            display: none;
        }
        .stored-tablets {
            margin-top: 40px;
        }
        .clear-storage-container {
            text-align: center;
            margin-bottom: 15px;
        }
        #clearStorageBtn {
            background-color: #ff5722;
            padding: 8px 15px;
            width: auto;
            flex: none;
        }
        #clearStorageBtn:hover {
            background-color: #e64a19;
        }
        .tablets-list {
            list-style-type: none;
            padding: 0;
            margin-top: 10px;
        }
        .tablets-list li {
            padding: 10px;
            background-color: #f9f9f9;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .tablets-list li:nth-child(odd) {
            background-color: #f0f0f0;
        }
        .price-per-tablet {
            margin-top: 15px;
            font-size: 16px;
            color: #1a73e8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chethana Medicals</h1>
        
        <div class="form-group">
            <label for="tabletName">Tablet Name:</label>
            <input type="text" id="tabletName" placeholder="Enter tablet name" required>
        </div>
        
        <div class="form-group">
            <label for="tabletsPerSheet">Number of Tablets in a Sheet:</label>
            <select id="tabletsPerSheet">
                <option value="5">5</option>
                <option value="10">6</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="30">30</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="sheetPrice">Price of One Sheet (₹):</label>
            <input type="number" id="sheetPrice" step="0.01" min="0" placeholder="Enter price in ₹" required>
        </div>
        
        <div class="price-per-tablet" id="pricePerTablet"></div>
        
        <div class="form-group">
            <label for="assignedTablets">Number of Tablets Assigned to Patient:</label>
            <input type="number" id="assignedTablets" min="1" placeholder="Enter number of tablets" required>
        </div>
        
        <div class="btn-group">
            <button id="calculateBtn">Add</button>
            <button id="clearBtn">Clear</button>
        </div>
        
        <div class="result hidden" id="result"></div>
        
        <div class="stored-tablets">
            <h2>Stored Tablets</h2>
            <div class="clear-storage-container">
                <button id="clearStorageBtn">Clear All Stored Tablets</button>
            </div>
            <ul class="tablets-list" id="tabletsList"></ul>
        </div>
    </div>

    <script>
        // Initialize stored tablets from localStorage or create empty array
        let storedTablets = JSON.parse(localStorage.getItem('tablets')) || [];
        
        // Display stored tablets on page load
        displayStoredTablets();
        
        // Event listeners
        document.getElementById('calculateBtn').addEventListener('click', calculatePrice);
        document.getElementById('clearBtn').addEventListener('click', clearForm);
        document.getElementById('clearStorageBtn').addEventListener('click', clearStorage);
        document.getElementById('sheetPrice').addEventListener('input', updatePricePerTablet);
        document.getElementById('tabletsPerSheet').addEventListener('change', updatePricePerTablet);
        document.getElementById('assignedTablets').addEventListener('input', updateTotalPrice);
        
        // Function to calculate price per tablet and update display
        function updatePricePerTablet() {
            const sheetPrice = parseFloat(document.getElementById('sheetPrice').value);
            const tabletsPerSheet = parseInt(document.getElementById('tabletsPerSheet').value);
            
            if (sheetPrice && tabletsPerSheet) {
                const pricePerTablet = sheetPrice / tabletsPerSheet;
                document.getElementById('pricePerTablet').textContent = 
                    `Price per tablet: ₹${pricePerTablet.toFixed(2)}`;
            } else {
                document.getElementById('pricePerTablet').textContent = '';
            }
        }
        
        // Function to calculate final price
        function calculatePrice() {
            // Get values from form
            const tabletName = document.getElementById('tabletName').value.trim();
            const tabletsPerSheet = parseInt(document.getElementById('tabletsPerSheet').value);
            const sheetPrice = parseFloat(document.getElementById('sheetPrice').value);
            const assignedTablets = parseInt(document.getElementById('assignedTablets').value);
            
            // Validate inputs
            if (!tabletName || !sheetPrice || !assignedTablets) {
                alert('Please fill in all fields');
                return;
            }
            
            // Calculate price per tablet
            const pricePerTablet = sheetPrice / tabletsPerSheet;
            
            // Calculate total price
            const totalPrice = pricePerTablet * assignedTablets;
            
            // Display result
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = `Total Cost = ₹${totalPrice.toFixed(2)} for ${assignedTablets} tablets at ₹${pricePerTablet.toFixed(2)} per tablet.`;
            resultDiv.classList.remove('hidden');
            
            // Store tablet data (avoid duplication)
            storeTabletData(tabletName, pricePerTablet);
        }
        
        // Function to store tablet data
        function storeTabletData(name, price) {
            // Check if tablet already exists
            const existingIndex = storedTablets.findIndex(tablet => 
                tablet.name.toLowerCase() === name.toLowerCase());
            
            if (existingIndex !== -1) {
                // Update existing tablet price
                storedTablets[existingIndex].price = price;
            } else {
                // Add new tablet
                storedTablets.push({
                    name: name,
                    price: price
                });
            }
            
            // Save to localStorage
            localStorage.setItem('tablets', JSON.stringify(storedTablets));
            
            // Update the displayed list
            displayStoredTablets();
        }
        
        // Function to display stored tablets
        function displayStoredTablets() {
            const tabletsList = document.getElementById('tabletsList');
            tabletsList.innerHTML = '';
            
            if (storedTablets.length === 0) {
                tabletsList.innerHTML = '<li>No tablets stored yet</li>';
                return;
            }
            
            storedTablets.forEach(tablet => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <span>${tablet.name}</span>
                    <span>₹${tablet.price.toFixed(2)} per tablet</span>
                `;
                tabletsList.appendChild(listItem);
            });
        }
        
        // Function to clear the form
        function clearForm() {
            document.getElementById('tabletName').value = '';
            document.getElementById('tabletsPerSheet').value = '10';
            document.getElementById('sheetPrice').value = '';
            document.getElementById('assignedTablets').value = '';
            document.getElementById('pricePerTablet').textContent = '';
            document.getElementById('result').classList.add('hidden');
        }
        
        // Function to clear localStorage
        function clearStorage() {
            if (confirm('Are you sure you want to delete all stored tablets?')) {
                localStorage.removeItem('tablets');
                storedTablets = [];
                displayStoredTablets();
                alert('All stored tablets have been deleted.');
            }
        }
        
        // Function to update total price in real-time
        function updateTotalPrice() {
            const sheetPrice = parseFloat(document.getElementById('sheetPrice').value);
            const tabletsPerSheet = parseInt(document.getElementById('tabletsPerSheet').value);
            const assignedTablets = parseInt(document.getElementById('assignedTablets').value);
            
            if (sheetPrice && tabletsPerSheet && assignedTablets) {
                const pricePerTablet = sheetPrice / tabletsPerSheet;
                const totalPrice = pricePerTablet * assignedTablets;
                
                const resultDiv = document.getElementById('result');
                resultDiv.textContent = `Total Cost = ₹${totalPrice.toFixed(2)} for ${assignedTablets} tablets at ₹${pricePerTablet.toFixed(2)} per tablet.`;
                resultDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
